/**
 * renderRail() — Phase 3 updated.
 * Branches on layoutMode before rendering.
 * Always calls updateLayoutPicker() and (in rail-focus) renderBoardProxy().
 */
function renderRail(){
  const rail=document.getElementById('rail');

  // Board-dominant: slim strip (or compact preflight if not started)
  if(layoutMode==='board-dominant'){
    rail.innerHTML=railState==='preflight'?renderPreflight():renderRailStrip();
    updateLayoutPicker();
    return;
  }

  // Board-only / standard: rail hidden by CSS in board-only, but still rendered
  // (navigation state stays live; board updates via applyBeatBoard)
  if(railState==='preflight'){
    rail.innerHTML=renderPreflight();
    updateLayoutPicker();
    return;
  }

  // Full active rail
  const progressHtml=renderProgressMap();
  const beatListHtml=CARTRIDGE.beats.map((beat,i)=>{
    return i===activeBeatIndex
      ? renderFocalCard(beat,i)
      : renderPeripheralBeat(beat,i);
  }).join('');

  const isFirst=activeBeatIndex===0;
  const isLast=activeBeatIndex===CARTRIDGE.beats.length-1;
  const prevDis=isFirst?'disabled':'';
  const nextCls=isLast?'nav-next nav-done':'nav-next';
  const nextLbl=isLast?'Done \u2713':'Next \u25B6';

  rail.innerHTML=`
    <div class="rail-active">
      ${progressHtml}
      <div class="rail-scroll" id="rail-scroll">
        <div class="beat-list">${beatListHtml}</div>
      </div>
      <div class="rail-nav">
        <button class="nav-prev" onclick="goToPrev()" ${prevDis}>\u25C4 Back</button>
        <button class="${nextCls}" onclick="goToNext()">${nextLbl}</button>
      </div>
    </div>`;

  updateLayoutPicker();
  // Phase 3: sync board proxy when in rail-focus mode
  if(layoutMode==='rail-focus') renderBoardProxy();
}

/**
 * applyBoardState(board) — Phase 2 full implementation.
 *
 * Sticky semantics: ONLY called when beat.board is present.
 * Never call for no-board beats — the board holds previous state.
 *
 * prePlace absent (undefined)  → tiles carry over (sticky within tiles mode)
 * prePlace present (any value) → tiles cleared, then entries placed
 */
function applyBoardState(board){
  if(!board) return; // defensive; navigation guards this
  const mode=board.mode;

  // ---- Engine-backed modes: tiles & clear ----
  if(mode==='tiles'||mode==='clear'){
    boardMode=mode; modeState=null;
    showEngineSurface();   // un-hide engine; empty the mode surface
    if(mode==='clear'){
      tiles=[]; boardLocked=false;
      syncStudentBoardView({render:false});
      renderWordPane(); return;
    }
    // tiles:
    // 1. Load Book level (cumulative tile set)
    if(board.level!=null) setEngineLevel(board.level);
    // 2. Open specified drawer
    if(board.openDrawer) switchDrawer(board.openDrawer);
    // 3. prePlace: only clear+rebuild if field is explicitly declared
    //    Absent prePlace → tiles carry over (model stays for practice)
    if(board.prePlace!==undefined){
      tiles=[];
      if(Array.isArray(board.prePlace)){
        board.prePlace.forEach(entry=>prePlaceWord(entry.word,entry.row||0));
      }
    }
    // 4. Lock flag (false if absent)
    boardLocked=!!board.lock;
    syncStudentBoardView({render:false});
    centerTilesForStudentView();
    renderWordPane(); return;
  }

  // ---- Student-page modes (non-tiles) ----
  // Critical: do NOT touch `tiles` / `boardLocked` — the engine simply hides.
  boardMode=mode;
  modeState=initModeState(mode,board);
  syncStudentBoardView({render:false});
  hideEngineSurface();
  renderModeSurface();
}

/** Reveal the tile engine; clear and hide the page-mode surface. */
function showEngineSurface(){
  const board=document.getElementById('board');
  board.classList.remove('mode-active');
  const ms=document.getElementById('mode-surface');
  if(ms) ms.innerHTML='';
}
/** Hide the tile engine surfaces (tiles persist); the mode surface shows via CSS. */
function hideEngineSurface(){
  document.getElementById('board').classList.add('mode-active');
}

// ================================================================
// PHASE 4 — STUDENT-PAGE MODE STATE + RENDERERS
// Each mode keeps its interactive sub-state in `modeState`, mutated by
// onclick handlers that then call renderModeSurface() to repaint #mode-surface.
// ================================================================

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/** Build fresh interactive state for a page mode from its cartridge payload. */
function initModeState(mode,board){
  if(mode==='word_frame'){
    return { mode, words:(board.words||[]).slice(), spot:0 };
  }
  if(mode==='phrase_builder'){
    const cols=board.columns||{};
    const order=Object.keys(cols);
    const selected={}; order.forEach(k=>selected[k]=null);
    return { mode, order, cols, selected };
  }
  if(mode==='fill_blanks'){
    const rows=(board.rows||[]).map(r=>{
      const parts=String(r).split('___');
      return { parts, fills:new Array(Math.max(0,parts.length-1)).fill(null) };
    });
    return { mode, bank:(board.bank||[]).slice(), rows, sel:null };
  }
  if(mode==='sentences'){
    return { mode, items:(board.items||[]).slice(), spot:0 };
  }
  if(mode==='story'){
    return { mode, title:board.title||'', subtitle:board.subtitle||'', text:board.text||'', pageType:board.pageType||'', images:(board.images||[]).slice() };
  }
  if(mode==='matching'){
    const pairs=(board.pairs||[]).filter(p=>Array.isArray(p)&&p.length>=2);
    const left=shuffle(pairs.map((p,i)=>({text:String(p[0]),pi:i})));
    const right=shuffle(pairs.map((p,i)=>({text:String(p[1]),pi:i})));
    return { mode, left, right, selL:null, selR:null, matched:new Set(), miss:null };
  }
  if(mode==='sight_words'){
    return { mode, words:(board.words||[]).slice(), spot:0, known:new Set(), missed:new Set() };
  }
  return { mode };
}

/** Repaint #mode-surface for the active page mode. */
function renderModeSurface(){
  const ms=document.getElementById('mode-surface');
  if(!ms||!modeState) return;
  const m=modeState.mode;
  let html='';
  if(m==='word_frame')         html=renderWordFrame();
  else if(m==='phrase_builder')html=renderPhraseBuilder();
  else if(m==='fill_blanks')   html=renderFillBlanks();
  else if(m==='sentences')     html=renderSentences();
  else if(m==='story')         html=renderStory();
  else if(m==='matching')      html=renderMatching();
  else if(m==='sight_words')   html=renderSightWords();
  ms.innerHTML=html;
}

// ---- word_frame ----
function renderWordFrame(){
  const s=modeState, n=s.words.length;
  if(layoutMode==='board-only'){
    const word=s.words[s.spot]||'';
    return `<div class="mode-pane student-reader-pane">
      <div class="reader-card reader-word ${word?'':'reader-empty'}"><div class="reader-text">${word?esc(word):'No word'}</div></div>
    </div>`;
  }
  const cells=s.words.map((w,i)=>
    `<div class="wf-word ${i===s.spot?'spot':''}" onclick="wfSpot(${i})">${esc(w)}</div>`).join('');
  return `<div class="mode-pane">
    <div class="mode-head">
      <span class="mode-title">Word frame</span>
      <div class="mode-stepper">
        <button class="mode-step-btn" onclick="wfStep(-1)" ${s.spot<=0?'disabled':''}>◄</button>
        <span class="mode-step-pos">${n?s.spot+1:0} / ${n}</span>
        <button class="mode-step-btn" onclick="wfStep(1)" ${s.spot>=n-1?'disabled':''}>►</button>
        <button class="mode-step-btn" onclick="wfSpeak()" title="Speak word">🔊</button>
      </div>
    </div>
    <div class="wf-grid">${cells}</div>
  </div>`;
}
function wfSpot(i){ modeState.spot=i; renderModeSurface(); }
function wfStep(d){ const s=modeState; s.spot=Math.max(0,Math.min(s.words.length-1,s.spot+d)); renderModeSurface(); }
function wfSpeak(){ const s=modeState; if(s.words[s.spot]) speakText(s.words[s.spot]); }

// ---- phrase_builder ----
function renderPhraseBuilder(){
  const s=modeState;
  const cols=s.order.map(key=>{
    const chips=(s.cols[key]||[]).map(chip=>
      `<div class="pb-chip ${s.selected[key]===chip?'sel':''}" onclick="pbPick('${escJsArg(key)}','${escJsArg(chip)}')">${esc(chip)}</div>`).join('');
    return `<div class="pb-col"><div class="pb-col-lbl">${esc(key)}</div>${chips}</div>`;
  }).join('');
  const anySel=s.order.some(k=>s.selected[k]);
  const trayInner=anySel
    ? s.order.map(k=>{
        const v=s.selected[k];
        return `<span class="pb-tray-word ${v?'':'placeholder'}">${esc(v|| '·')}</span>`;
      }).join(' ')
    : '<span class="pb-tray-empty">Tap a chip in each column to build a sentence</span>';
  return `<div class="mode-pane">
    <div class="mode-head"><span class="mode-title">Phrase builder</span>
      <span class="mode-hint">Tap to set each slot</span></div>
    <div class="pb-cols">${cols}</div>
    <div class="pb-tray">${trayInner}</div>
  </div>`;
}
function pbPick(key,chip){
  const s=modeState;
  s.selected[key]=(s.selected[key]===chip)?null:chip; // tap again to clear slot
  renderModeSurface();
}

// ---- fill_blanks ----
function renderFillBlanks(){
  const s=modeState;
  const rowsHtml=s.rows.map((row,ri)=>{
    let html='';
    row.parts.forEach((part,pi)=>{
      html+=`<span class="fb-text">${esc(part)}</span>`;
      if(pi<row.parts.length-1){
        const fill=row.fills[pi];
        html+=`<span class="fb-blank ${fill?'filled':''}" onclick="fbBlank(${ri},${pi})">${fill?esc(fill):''}</span>`;
      }
    });
    return `<div class="fb-row">${html}</div>`;
  }).join('');
  const bankHtml=s.bank.map((chip,i)=>
    `<div class="fb-chip ${s.sel===i?'sel':''}" onclick="fbChip(${i})">${esc(chip)}</div>`).join('');
  return `<div class="mode-pane">
    <div class="mode-head"><span class="mode-title">Fill the blanks</span>
      <span class="mode-hint">Tap a letter, then a blank · tap a filled blank to clear</span></div>
    <div class="fb-rows">${rowsHtml}</div>
    <div class="fb-bank">${bankHtml}</div>
  </div>`;
}
function fbChip(i){ const s=modeState; s.sel=(s.sel===i)?null:i; renderModeSurface(); }
function fbBlank(ri,pi){
  const s=modeState, cur=s.rows[ri].fills[pi];
  if(cur){ s.rows[ri].fills[pi]=null; }          // tap filled → clear (chip "returns")
  else if(s.sel!=null){ s.rows[ri].fills[pi]=s.bank[s.sel]; s.sel=null; } // place selected
  renderModeSurface();
}

// ---- sentences ----
function splitReadItem(text){
  const raw=String(text||'');
  const idx=raw.indexOf(':');
  if(idx>0 && idx<=18){
    return { label:raw.slice(0,idx).trim(), body:raw.slice(idx+1).trim() };
  }
  return { label:'', body:raw };
}
function renderSentences(){
  const s=modeState, n=s.items.length;
  if(layoutMode==='board-only'){
    const item=splitReadItem(s.items[s.spot]||'');
    const text=item.body||item.label||'No sentence';
    return `<div class="mode-pane student-reader-pane">
      <div class="reader-card reader-sentence ${n?'':'reader-empty'}"><div class="reader-text">${esc(text)}</div></div>
    </div>`;
  }
  const items=s.items.map((it,i)=>{
    const item=splitReadItem(it);
    const label=item.label?`<span class="sn-label">${esc(item.label)}</span>`:'';
    return `<div class="sn-item ${i===s.spot?'spot':''}" onclick="snSpot(${i})">${label}${esc(item.body||item.label)}</div>`;
  }).join('');
  return `<div class="mode-pane">
    <div class="mode-head">
      <span class="mode-title">Sentences</span>
      <div class="mode-stepper">
        <button class="mode-step-btn" onclick="snStep(-1)" ${s.spot<=0?'disabled':''}>◄</button>
        <span class="mode-step-pos">${n?s.spot+1:0} / ${n}</span>
        <button class="mode-step-btn" onclick="snStep(1)" ${s.spot>=n-1?'disabled':''}>►</button>
      </div>
    </div>
    <div class="sn-list">${items}</div>
  </div>`;
}
function snSpot(i){ modeState.spot=i; renderModeSurface(); }
function snStep(d){ const s=modeState; s.spot=Math.max(0,Math.min(s.items.length-1,s.spot+d)); renderModeSurface(); }

// ---- story ----
function renderStory(){
  const s=modeState;
  if(s.pageType==='worksheet'||s.pageType==='reference_page'){
    if(s.images&&s.images.length){
      const imgs=s.images.map((entry,i)=>{
        const img=typeof entry==='string' ? {src:entry} : (entry||{});
        const label=img.label||`${s.pageType==='reference_page'?'Reference page':'Worksheet'} ${i+1}`;
        const alt=img.alt||label;
        return `<figure class="worksheet-image-frame">
          ${label?`<figcaption class="worksheet-image-label">${esc(label)}</figcaption>`:''}
          <img class="worksheet-image" src="${esc(img.src||'')}" alt="${esc(alt)}" loading="eager">
        </figure>`;
      }).join('');
      return `<div class="story-pane worksheet-pane">
        <div class="worksheet-images">${imgs}</div>
        ${s.text?`<div class="worksheet-caption">${esc(s.text)}</div>`:''}
      </div>`;
    }
    if(s.pageType==='reference_page'){
      return `<div class="story-pane worksheet-pane">
        <div class="worksheet-card">
          <div class="worksheet-kicker">Student reference page</div>
          ${s.title?`<div class="worksheet-title">${esc(s.title)}</div>`:''}
          ${s.subtitle?`<div class="worksheet-subtitle">${esc(s.subtitle)}</div>`:''}
          <div class="worksheet-subtitle">${esc(s.text||'Reference page image not provided.')}</div>
        </div>
      </div>`;
    }
    const lines=Array.from({length:10},(_,i)=>`<div class="worksheet-line" data-num="${i+1}."></div>`).join('');
    return `<div class="story-pane worksheet-pane">
    <div class="worksheet-card">
      <div class="worksheet-kicker">${s.pageType==='reference_page'?'Student reference page':'Student worksheet'}</div>
      ${s.title?`<div class="worksheet-title">${esc(s.title)}</div>`:''}
      ${s.subtitle?`<div class="worksheet-subtitle">${esc(s.subtitle)}</div>`:''}
      ${s.text?`<div class="worksheet-subtitle">${esc(s.text)}</div>`:''}
      <div class="worksheet-lines">${lines}</div>
    </div>
  </div>`;
  }
  return `<div class="story-pane">
    <div class="story-card">
      ${s.title?`<div class="story-title">${esc(s.title)}</div>`:''}
      <div class="story-text">${esc(s.text)}</div>
    </div>
  </div>`;
}

// ---- matching ----
function renderMatching(){
  const s=modeState;
  const leftHtml=s.left.map((c,i)=>{
    const matched=s.matched.has(c.pi);
    const cls=matched?'matched':(s.selL===i?'sel':(s.miss&&s.miss[0]===i?'miss':''));
    return `<div class="mt-cell ${cls}" onclick="mtPick('L',${i})">${esc(c.text)}</div>`;
  }).join('');
  const rightHtml=s.right.map((c,i)=>{
    const matched=s.matched.has(c.pi);
    const cls=matched?'matched':(s.selR===i?'sel':(s.miss&&s.miss[1]===i?'miss':''));
    return `<div class="mt-cell ${cls}" onclick="mtPick('R',${i})">${esc(c.text)}</div>`;
  }).join('');
  const done=s.matched.size===s.left.length&&s.left.length>0;
  return `<div class="mode-pane">
    <div class="mode-head"><span class="mode-title">Matching</span>
      <span class="mode-hint">${done?'All matched ✓':'Tap one from each side'}</span></div>
    <div class="mt-board">
      <div class="mt-col">${leftHtml}</div>
      <div class="mt-col">${rightHtml}</div>
    </div>
  </div>`;
}
function mtPick(side,i){
  const s=modeState;
  const cell=(side==='L'?s.left:s.right)[i];
  if(s.matched.has(cell.pi)) return;       // already locked
  if(side==='L') s.selL=(s.selL===i?null:i);
  else           s.selR=(s.selR===i?null:i);
  s.miss=null;
  if(s.selL!=null&&s.selR!=null){
    if(s.left[s.selL].pi===s.right[s.selR].pi){
      s.matched.add(s.left[s.selL].pi); s.selL=null; s.selR=null; // correct → lock
    } else {
      s.miss=[s.selL,s.selR]; s.selL=null; s.selR=null;           // "not here" → return
      renderModeSurface();
      setTimeout(()=>{ if(modeState===s){ s.miss=null; renderModeSurface(); } },350);
      return;
    }
  }
  renderModeSurface();
}

// ---- sight_words ----
function renderSightWords(){
  const s=modeState, n=s.words.length, current=s.words[s.spot]||'';
  if(layoutMode==='board-only'){
    return `<div class="mode-pane student-reader-pane">
      <div class="reader-card reader-word ${current?'':'reader-empty'}"><div class="reader-text">${current?esc(current):'No sight word'}</div></div>
    </div>`;
  }
  const pills=s.words.map((w,i)=>{
    const cls=[
      s.spot===i?'spot':'',
      s.known&&s.known.has(i)?'known':'',
      s.missed&&s.missed.has(i)?'missed':''
    ].filter(Boolean).join(' ');
    return `<div class="sw-pill ${cls}" onclick="swTap(${i})">${esc(w)}</div>`;
  }).join('');
  const missedWords=s.words.filter((_,i)=>s.missed&&s.missed.has(i));
  const deck=missedWords.length
    ? missedWords.map(w=>`<span>${esc(w)}</span>`).join('')
    : '<span>No missed words marked yet</span>';
  return `<div class="mode-pane">
    <div class="mode-head">
      <span class="mode-title">Sight words</span>
      <div class="mode-stepper">
        <button class="mode-step-btn" onclick="swStep(-1)" ${s.spot<=0?'disabled':''}>◄</button>
        <span class="mode-step-pos">${n?s.spot+1:0} / ${n}</span>
        <button class="mode-step-btn" onclick="swStep(1)" ${s.spot>=n-1?'disabled':''}>►</button>
      </div>
    </div>
    <div class="sw-teacher-current">
      <div class="sw-current-word">${current?esc(current):'No sight word'}</div>
      <div class="sw-markers">
        <button class="sw-mark-btn known" onclick="swMark('known')">Known</button>
        <button class="sw-mark-btn missed" onclick="swMark('missed')">Needs card</button>
      </div>
    </div>
    <div class="sw-wrap">${pills}</div>
    <div class="reading-deck"><div class="reading-deck-title">Reading Deck to build</div><div class="reading-deck-list">${deck}</div></div>
  </div>`;
}
function swTap(i){ const s=modeState; s.spot=i; renderModeSurface(); if(s.words[i]) speakText(s.words[i]); }
function swStep(d){ const s=modeState; s.spot=Math.max(0,Math.min(s.words.length-1,s.spot+d)); renderModeSurface(); }
function swMark(kind){
  const s=modeState, i=s.spot;
  if(!s.words[i]) return;
  if(!s.known) s.known=new Set();
  if(!s.missed) s.missed=new Set();
  if(kind==='known'){
    s.known.add(i); s.missed.delete(i);
  } else {
    s.missed.add(i); s.known.delete(i);
  }
  renderModeSurface();
}

// ================================================================
// KEYBOARD NAVIGATION
// Guard: don't fire while focus is inside a form element.
// ================================================================
document.addEventListener('keydown', (e)=>{
  // Fix B: student device. In board-only, a child sits at the Chromebook;
  // a bumped spacebar must NOT advance/retreat beats. Nav stays live in the
  // three deliverer-facing layouts.
  if(layoutMode==='board-only'){
    if(e.key==='Escape'){
      e.preventDefault();
      selectLayout('rail-focus');
    }
    return;
  }
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if(e.target.isContentEditable) return;
  if(railState!=='active') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){
    e.preventDefault(); goToNext();
  } else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){
    e.preventDefault(); goToPrev();
  }
});

// BOOT
// ================================================================
// Wire tile engine controls
document.getElementById('lessonSelect').addEventListener('change', renderTray);
document.getElementById('resetButton').addEventListener('click', ()=>{ tiles=[]; draggedTile=null; renderWordPane(); });
document.getElementById('speakButton').addEventListener('click', speakAllBoard);
document.getElementById('cartridgeSelect').addEventListener('change', (e)=>selectCartridge(e.target.value));
document.querySelectorAll('.drawer-tab').forEach(tab=>{
  tab.addEventListener('click',(e)=>{ e.preventDefault(); switchDrawer(tab.dataset.drawer); });
});

// Phase 4: default video speed from cartridge meta (1.5 if absent)
videoSpeed = (CARTRIDGE.meta && CARTRIDGE.meta.videoSpeedDefault) || 1.5;

// Boot tile engine
renderAlphabet();
renderTray();
renderWordPane();

// Boot rail (shows pre-flight) + init layout picker state
renderRail();
updateLayoutPicker();
setCartridgeStatus(`${CARTRIDGE.beats.length} beats`);
</script>
