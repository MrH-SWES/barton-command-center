        if (isActive) {
          let launchFn = '';
          if (step.mode === 'word_frame')       launchFn = `launchWordFrame(${JSON.stringify(step.payload).replace(/"/g,"'")})` ;
          else if (step.mode === 'phrase_builder')   launchFn = `launchPhraseBuilder(${JSON.stringify(step.payload).replace(/"/g,"'")})`;
          else if (step.mode === 'sentence_marking') launchFn = `launchSentences(${JSON.stringify(step.payload).replace(/"/g,"'")})`;
          else if (step.mode === 'story_reading')    launchFn = `launchStory(${JSON.stringify(step.payload).replace(/"/g,"'")})`;
          else if (step.mode === 'matching')         launchFn = `launchMatching(${JSON.stringify(step.payload).replace(/"/g,"'")})`;
          else if (step.mode === 'fill_blanks')      launchFn = `launchFillBlanks(${JSON.stringify(step.payload).replace(/"/g,"'")})`;
          if (launchFn) actionHtml = `<button class="fc-action-btn" onclick="${launchFn}">&#127919; Launch ${escHtml(modeLabel)}</button>`;
        }

      } else if (step.type === 'sight_word_tracker') {
        const pills = (step.words || []).map(w => `<span class="fc-word-pill">${escHtml(w)}</span>`).join('');
        mainHtml = `<div class="fc-words-grid">${pills}</div>`;
        if (isActive) {
          const payloadStr = JSON.stringify(step.words).replace(/"/g, "'");
          actionHtml = `<button class="fc-action-btn" onclick="launchWordFrame(${payloadStr})">&#128444; Launch on Board</button>`;
        }

      } else if (step.type === 'guided_discovery') {
        const prompts = (step.prompts || []).map((p, i) => `<div>${i+1}. "${escHtml(p)}"</div>`).join('');
        mainHtml = `<div class="fc-main" style="font-size:0.88rem;line-height:1.6;">${prompts}</div>`;
      }

      const currentLabel = isActive ? '<div class="fc-current-label">&#9654; CURRENT STEP</div>' : '';
      const clickHandler = isActive ? '' : `onclick="jumpToStep(${cardIndex})"`;
      return `<div class="fc ${stateClass}" id="feed-card-${cardIndex}" ${clickHandler}>${currentLabel}${badgeHtml}${mainHtml}${supportHtml}${actionHtml}</div>`;
    }

    function renderTeachingFeed() {
      const feed = document.getElementById('teaching-feed');
      if (!feed) return;

      if (!stepCards.length || !flatSteps.length) {
        feed.innerHTML = '<div id="feed-idle">Select a lesson from the board controls on the right.</div>';
        updateFeedHeader();
        return;
      }

      // Find section id of current card
      const secId = getSectionForStep(currentStepIndex);

      // Collect all card indices in the current section
      const sectionCardIndices = stepCards.map((c, i) => i).filter(i => {
        const p = stepCards[i].closest('.tp-section');
        return p && p.dataset.sectionId === secId;
      });

      // Build feed HTML
      feed.innerHTML = sectionCardIndices.map(i => buildFeedCardHtml(i)).join('');

      // Scroll active card into view
      const activeEl = document.getElementById(`feed-card-${currentStepIndex}`);
      if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

      updateFeedHeader();
    }

    function updateFeedHeader() {
      const titleEl = document.getElementById('feed-section-title');
      const progEl  = document.getElementById('feed-progress');
      if (!titleEl || !progEl) return;
      if (!stepCards.length) {
        titleEl.textContent = 'Load a lesson to begin';
        progEl.textContent = '';
        return;
      }
      const secId = getSectionForStep(currentStepIndex);
      const sec = currentLessonData ? currentLessonData.sections.find(s => s.id === secId) : null;
      const sectionCardIndices = stepCards.map((c, i) => i).filter(i => {
        const p = stepCards[i].closest('.tp-section'); return p && p.dataset.sectionId === secId;
      });
      const posInSec = sectionCardIndices.indexOf(currentStepIndex) + 1;
      titleEl.textContent = sec ? sec.title : secId || '';
      progEl.textContent = `Step ${posInSec} of ${sectionCardIndices.length} in section  ·  ${currentStepIndex + 1} / ${stepCards.length} total`;

      // Keep old counter in sync
      const counter = document.getElementById('tp-step-counter');
      if (counter) counter.textContent = `${currentStepIndex + 1} / ${stepCards.length}`;
    }

    // Keep renderNowCard as alias so nothing breaks
    function renderNowCard() { renderTeachingFeed(); }

    function buildTeleprompter(data) {
      const list = document.getElementById('section-script-list');
      if (!list) return;
      const secId = getSectionForStep(currentStepIndex);
      if (!secId || !flatSteps.length) { list.innerHTML = ''; return; }
      // Get cards in current section
      const cardsInSec = stepCards.map((c, i) => ({ c, i })).filter(({ c }) => {
        const p = c.closest('.tp-section');
        return p && p.dataset.sectionId === secId;
      });
      const items = cardsInSec.map(({ c, i }, posInSec) => {
        const isActive = i === currentStepIndex;
        // Find the primary step for this card
        const secSteps = getSectionStepsForCard(i);
        let openerCount = -1;
        let primaryStep = null;
        for (let j = 0; j < secSteps.length; j++) {
          const s = secSteps[j];
          let opens = s.type === 'dialogue' || s.type === 'teacher_note' || s.type === 'guided_discovery';
          if (!opens && s.type === 'action') { const t = s.text.trim(); opens = t.startsWith('Tutor') || t.startsWith('Dictate'); }
          if (opens) { openerCount++; if (openerCount === posInSec) { primaryStep = s; break; } }
        }
        if (!primaryStep) primaryStep = secSteps[0];
        const role = getStepRole(primaryStep);
        const summary = getStepSummary(primaryStep);
        const truncated = summary.length > 80 ? summary.slice(0, 78) + '…' : summary;
        return `<div class="ss-item${isActive ? ' ss-active' : ''}" onclick="jumpToStep(${i})">
          <span class="ss-num">${posInSec + 1}</span>
          <span class="ss-badge ${role.cls}" style="font-size:0.58rem;">${role.label}</span>
          <span class="ss-text">${escHtml(truncated)}</span>
        </div>`;
      }).join('');
      list.innerHTML = items || '<div style="padding:10px;color:#94a3b8;font-size:0.8rem;">No steps in this section.</div>';
      // Scroll active item into view if list is open
      if (list.classList.contains('open')) {
        const activeEl = list.querySelector('.ss-active');
        if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
      }
    }

    let _scriptOpen = false;
    function toggleSectionScript() {
      _scriptOpen = !_scriptOpen;
      const list = document.getElementById('section-script-list');
      const btn  = document.getElementById('section-script-toggle');
      if (list) list.classList.toggle('open', _scriptOpen);
      if (btn)  btn.textContent = (_scriptOpen ? '▾ Hide' : '▸ Show') + ' section script';
      if (_scriptOpen) renderSectionScript();
    }

    function buildTeleprompter(data) {
      currentLessonData = data;
      flattenLesson(data);
      audioRegistry = {};
      wordFrameRegistry = {};
      phraseBuilderRegistry = {};
      fillBlanksRegistry = {};
      storyRegistry = {};
      sentenceRegistry = {};
      matchingRegistry = {};
      currentStepIndex = 0;
      stepCards = [];

      // Update left rail header
      const lrName = document.getElementById('lr-lesson-name');
      if (lrName) lrName.textContent = `Level ${data.level}, Lesson ${data.lesson}: ${data.title}`;

      const tp = document.getElementById('tp-content');
      let html = `<h2 class="tp-header">Level ${data.level}, Lesson ${data.lesson}: ${data.title}</h2>`;
      let globalStepIdx = 0;

      data.sections.forEach((sec, sIdx) => {
        // data-section-id lets renderLessonMap identify which section each card belongs to
        html += `<div class="tp-section inactive-section" data-section-id="${escHtml(sec.id)}"><h3>${escHtml(sec.title)}</h3>`;

        // --- Grouped card state for this section ---
        let cardItems = [];
        let cardId = null;
        let cardClass = null;

        function flushCard() {
          if (cardId === null) return;
          html += `<div class="tp-step-card ${cardClass}" id="${cardId}">${cardItems.join('')}</div>`;
          cardItems = [];
          cardId = null;
          cardClass = null;
        }

        function startCard() {
          flushCard();
          cardId = `global-step-${globalStepIdx}`;
          cardClass = globalStepIdx === 0 ? 'active-step' : 'inactive-step';
          globalStepIdx++;
        }

        sec.steps.forEach((step, stepIdx) => {
          const uniqueId = `step_${sIdx}_${stepIdx}`;

          // Determine whether this step opens a new card or appends to current
          let opensNewCard;
          if (step.type === 'dialogue') {
            opensNewCard = true;
          } else if (step.type === 'action') {
            const txt = step.text.trim();
            opensNewCard = txt.startsWith('Tutor') || txt.startsWith('Dictate');
          } else if (step.type === 'board_action' || step.type === 'student_page' || step.type === 'sight_word_tracker') {
            opensNewCard = false;
          } else {
            // teacher_note, guided_discovery → own card
            opensNewCard = true;
          }

          if (opensNewCard) {
            startCard();
          } else if (cardId === null) {
            startCard(); // fallback: no current card yet
          }

          // Render this step's HTML and push into the current card
          if (step.type === 'teacher_note') {
            cardItems.push(`<div class="tutor-note">📝 ${step.text}</div>`);
          }
          else if (step.type === 'dialogue') {
            let audioBtn = '';
            if (step.audio) {
              audioRegistry[uniqueId] = step.audio;
              audioBtn = `<button class="audio-btn" onclick="speakText(window.audioRegistry['${uniqueId}'])">🔊</button>`;
            }
            cardItems.push(`<p class="dialogue"><span class="tp-say-label">💬 SAY:</span> "${escHtml(step.text)}" ${audioBtn}</p>`);
          }
          else if (step.type === 'action') {
            const txt = step.text.trim();
            if (txt.startsWith('Expected:')) {
              cardItems.push(`<p class="action tp-listen"><span class="tp-listen-label">👂 LISTEN FOR:</span> ${escHtml(txt.slice('Expected:'.length).trim())}</p>`);
            } else {
              cardItems.push(`<p class="action tp-do"><span class="tp-do-label">✋ DO:</span> ${escHtml(txt)}</p>`);
            }
          }
          else if (step.type === 'board_action' && step.command === 'spawn_tiles') {
            const payloadStr = JSON.stringify(step.payload).replace(/"/g, "'");
            cardItems.push(`<button class="spawn-btn" onclick="spawnTiles(${payloadStr})">🚀 Spawn Tiles: ${escHtml(step.payload.join('-').toUpperCase())}</button>`);
          }
          else if (step.type === 'sight_word_tracker') {
            const payloadStr = JSON.stringify(step.words).replace(/"/g, "'");
            const pills = step.words.map(w => `<span class="sight-word-pill">${escHtml(w)}</span>`).join('');
            cardItems.push(`
              <div class="sight-word-tracker">
                <h4>👁️ Sight Word Tracker</h4>
                <div class="sight-word-list">${pills}</div>
                <button class="spawn-btn" style="margin-top: 10px;" onclick="launchWordFrame(${payloadStr})">🖼️ Launch Sight Words on Board</button>
              </div>`);
          }
          else if (step.type === 'student_page') {
            cardItems.push(buildStudentPage(step, uniqueId));
          }
          else if (step.type === 'guided_discovery') {
            cardItems.push(`
              <button class="error-btn" onclick="document.getElementById('${uniqueId}').style.display = document.getElementById('${uniqueId}').style.display === 'block' ? 'none' : 'block'">
                🆘 STUDENT STRUGGLING? (Guided Discovery)
              </button>
              <div id="${uniqueId}" class="guided-discovery">
                <strong>Guided Discovery:</strong><br>
                ${step.prompts.map((p, i) => `${i+1}. "${p}"`).join('<br>')}
              </div>`);
          }
        });

        flushCard(); // close the last open card in this section
        html += `</div>`;
      });

      tp.innerHTML = html;

      // Populate the live NodeList for keyboard navigation
      stepCards = Array.from(tp.querySelectorAll('.tp-step-card'));

      // Initialize first card, section highlight, and counter
      if (stepCards.length > 0) {
        stepCards[0].classList.remove('inactive-step');
        stepCards[0].classList.add('active-step');
        updateSectionHighlight(stepCards[0]);
        stepCards[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      updateStepCounter();
      // Populate the lesson map rail
      renderLessonMap();
      renderNowCard();
    }

    // ====== HTML ESCAPE HELPER ======
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function toTitleCase(str) {
      return str.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    // ====== STUDENT PAGE BUILDER ======
    function buildStudentPage(step, uniqueId) {
      let modeLabel = toTitleCase(step.mode);
      let body = '';

      if (step.mode === 'word_frame') {
        wordFrameRegistry[uniqueId] = step.payload;
        const items = step.payload.map(w => `<span class="word-frame-item">${escHtml(w)}</span>`).join('');
        body = `
          <div class="word-frame-grid">${items}</div>
          <button class="spawn-btn" onclick="launchWordFrame(wordFrameRegistry['${uniqueId}'])">🖼️ Launch Word Frame on Board</button>`;

      } else if (step.mode === 'phrase_builder') {
        phraseBuilderRegistry[uniqueId] = step.payload;
        const cols = Object.entries(step.payload).map(([key, vals]) => {
          const label = escHtml(toTitleCase(key));
          const items = vals.map(v => `<span class="word-frame-item">${escHtml(v)}</span>`).join('');
          return `<div class="phrase-col"><div class="phrase-col-label">${label}</div><div class="phrase-col-items">${items}</div></div>`;
        }).join('');
        body = `
          <div class="phrase-builder">${cols}</div>
          <button class="spawn-btn" onclick="launchPhraseBuilder(phraseBuilderRegistry['${uniqueId}'])">🧩 Launch Phrase Builder on Board</button>`;

      } else if (step.mode === 'sentence_marking') {
        sentenceRegistry[uniqueId] = step.payload;
        const sentences = step.payload.map(s => `<div class="sentence-item">${escHtml(s)}</div>`).join('');
        body = `
          <div class="sentence-list">${sentences}</div>
          <button class="spawn-btn" onclick="launchSentences(sentenceRegistry['${uniqueId}'])">✏️ Launch Sentences on Board</button>`;

      } else if (step.mode === 'story_reading') {
        storyRegistry[uniqueId] = step.payload;
        body = `
          <div class="story-title">${escHtml(step.payload.title)}</div>
          <div class="story-text">${escHtml(step.payload.text)}</div>
          <button class="spawn-btn" onclick="launchStory(storyRegistry['${uniqueId}'])">📖 Launch Story on Board</button>`;

      } else if (step.mode === 'matching') {
        matchingRegistry[uniqueId] = step.payload;
        const left = step.payload.left.map(w => `<div class="matching-item">${escHtml(w)}</div>`).join('');
        const right = step.payload.right.map(w => `<div class="matching-item">${escHtml(w)}</div>`).join('');
        body = `
          <div class="matching-cols"><div class="matching-col">${left}</div><div class="matching-col">${right}</div></div>
          <button class="spawn-btn" onclick="launchMatching(matchingRegistry['${uniqueId}'])">🔗 Launch Matching on Board</button>`;

      } else if (step.mode === 'fill_blanks') {
        fillBlanksRegistry[uniqueId] = step.payload;
        const bankItems = step.payload.bank.map(b => `<span class="fill-bank-item">${escHtml(b)}</span>`).join('');
        const endingItems = step.payload.endings.map(e => `<span class="fill-ending-item">${escHtml(e)}</span>`).join('');
        body = `
          <div class="fill-blanks-label">Word Bank</div>
          <div class="fill-blanks-bank">${bankItems}</div>
          <div class="fill-blanks-label">Endings</div>
          <div class="fill-endings-list">${endingItems}</div>
          <button class="spawn-btn" onclick="launchFillBlanks(fillBlanksRegistry['${uniqueId}'])">🧲 Launch Fill-in-the-Blanks on Board</button>`;
      }

      return `
        <div class="student-page">
          <div class="student-page-header">📄 Student Page — ${escHtml(modeLabel)}</div>
          <div class="student-page-body">${body}</div>
        </div>`;
    }

    // ====== WORD FRAME ENGINE ======
    function launchWordFrame(wordsArray) {
      if (!Array.isArray(wordsArray) || wordsArray.length === 0) return;
      document.getElementById('wordPane').classList.add('hidden');
      const pageView = document.getElementById('student-page-view');
      pageView.classList.remove('hidden');

      currentStudentPageWords = wordsArray;
      currentWordIndex = 0;

      renderWordGrid();
    }

    function renderWordGrid() {
      const pageView = document.getElementById('student-page-view');

      let gridHTML = '<div class="word-grid">';
      currentStudentPageWords.forEach((word, i) => {
        const isActive = i === currentWordIndex;
        gridHTML += `<div class="word-item${isActive ? ' active-frame' : ''}">${escHtml(word)}</div>`;
      });
      gridHTML += '</div>';

      gridHTML += `
        <div class="word-frame-nav">
          <button class="btn secondary" onclick="moveFrame(-1)">◀ Prev</button>
          <span class="word-frame-counter">${currentWordIndex + 1} / ${currentStudentPageWords.length}</span>
          <button class="btn secondary" onclick="moveFrame(1)">Next ▶</button>
        </div>
        <button class="btn danger" onclick="closeWordFrame()">✕ Return to Tile Board</button>
      `;

      pageView.innerHTML = gridHTML;
    }

    function moveFrame(direction) {
      if (currentStudentPageWords.length === 0) return;
      currentWordIndex = Math.max(0, Math.min(currentWordIndex + direction, currentStudentPageWords.length - 1));
      renderWordGrid();
    }

    function closeWordFrame() {
      document.getElementById('student-page-view').classList.add('hidden');
      document.getElementById('wordPane').classList.remove('hidden');
    }

    // ====== PHRASE BUILDER ENGINE ======
    function launchPhraseBuilder(payload) {
      if (!payload || typeof payload !== 'object') return;
      document.getElementById('wordPane').classList.add('hidden');
      const pageView = document.getElementById('student-page-view');
      pageView.classList.remove('hidden');
      currentPhrasePayload = payload;
      currentBuiltSentence = [];
      renderPhraseBuilder();
    }

    function renderPhraseBuilder() {
      const pageView = document.getElementById('student-page-view');
      phraseCardPhrases = [];

      const cols = Object.entries(currentPhrasePayload).map(([key, vals]) => {
        const label = escHtml(toTitleCase(key));
        const cards = vals.map(v => {
          const idx = phraseCardPhrases.length;
          phraseCardPhrases.push(v);
          return `<div class="pb-phrase-card" onclick="addPhrase(${idx})">${escHtml(v)}</div>`;
        }).join('');
        return `<div class="pb-column"><div class="pb-column-label">${label}</div>${cards}</div>`;
      }).join('');

      const trayContent = currentBuiltSentence.length > 0
        ? escHtml(currentBuiltSentence.join(' ') + '.')
        : `<span class="pb-tray-placeholder">Tap phrases to build a sentence...</span>`;

      pageView.innerHTML = `
        <div class="pb-view">
          <div class="pb-columns">${cols}</div>
          <div class="pb-tray-section">
            <div class="pb-tray-label">Sentence Tray</div>
            <div class="pb-tray">${trayContent}</div>
            <div class="pb-controls">
              <button class="btn secondary" onclick="clearSentence()">🗑️ Clear Sentence</button>
              <button class="btn danger" onclick="closePhraseBuilder()">✕ Return to Tile Board</button>
            </div>
          </div>
        </div>
      `;
    }

    function addPhrase(idx) {
      currentBuiltSentence.push(phraseCardPhrases[idx]);
      renderPhraseBuilder();
    }

    function clearSentence() {
      currentBuiltSentence = [];
      renderPhraseBuilder();
    }

    function closePhraseBuilder() {
      document.getElementById('student-page-view').classList.add('hidden');
      document.getElementById('wordPane').classList.remove('hidden');
      currentBuiltSentence = [];
      currentPhrasePayload = {};
    }

    // ====== FILL IN THE BLANKS ENGINE ======
    let currentFillBlanksPayload = null;
    let draggedEl = null;

    function launchFillBlanks(payload) {
      if (!payload || !payload.bank || !payload.endings) return;
      document.getElementById('wordPane').classList.add('hidden');
      const pageView = document.getElementById('student-page-view');
      pageView.classList.remove('hidden');
      currentFillBlanksPayload = payload;
      renderFillBlanks(payload);
    }

    function renderFillBlanks(payload) {
      const pageView = document.getElementById('student-page-view');

      const bankItems = payload.bank.map((item, i) =>
        `<div class="drag-item" draggable="true" id="drag-item-${i}">${escHtml(item)}</div>`
      ).join('');

      const targetRows = payload.endings.map((ending, i) => {
        const parts = ending.split('___');
        const leftText = parts[0] ? `<span>${escHtml(parts[0])}</span>` : '';
        const rightText = parts[1] ? `<span>${escHtml(parts[1])}</span>` : '';
        return `<div class="fb-target-row">
          ${leftText}<div class="drop-zone" id="drop-zone-${i}"></div>${rightText}
        </div>`;
      }).join('');

      pageView.innerHTML = `
        <div class="fb-view">
          <div class="fb-bank-section">
            <div class="fb-bank-label">Word Bank — drag items into the blanks below</div>
            <div class="fb-bank" id="fb-bank">${bankItems}</div>
          </div>
          <div class="fb-targets">${targetRows}</div>
          <div class="fb-controls">
            <button class="btn secondary" onclick="resetFillBlanks()">↺ Reset Board</button>
            <button class="btn danger" onclick="closeFillBlanks()">✕ Return to Tile Board</button>
          </div>
        </div>
      `;

      initDragAndDrop();
    }

    function initDragAndDrop() {
      const pageView = document.getElementById('student-page-view');

      pageView.addEventListener('dragstart', (e) => {
        const item = e.target.closest('.drag-item');
        if (!item) return;
        draggedEl = item;
        setTimeout(() => item.classList.add('dragging'), 0);
      });

      pageView.addEventListener('dragend', (e) => {
        const item = e.target.closest('.drag-item');
        if (item) item.classList.remove('dragging');
        draggedEl = null;
      });

      pageView.addEventListener('dragover', (e) => {
        const zone = e.target.closest('.drop-zone');
        const bank = e.target.closest('#fb-bank');
        if (zone || bank) {
          e.preventDefault();
          if (zone) zone.classList.add('drag-over');
        }
      });

      pageView.addEventListener('dragleave', (e) => {
        const zone = e.target.closest('.drop-zone');
        if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
      });

      pageView.addEventListener('drop', (e) => {
        if (!draggedEl) return;
        const zone = e.target.closest('.drop-zone');
        const bank = e.target.closest('#fb-bank');
        if (!zone && !bank) return;
        e.preventDefault();

        if (zone) {
          zone.classList.remove('drag-over');
          // Evict existing item in this drop zone
          const existing = zone.querySelector('.drag-item');
          if (existing && existing !== draggedEl) {
            existing.remove();
          }
          // If dragged from bank, clone it. Otherwise, move it.
          if (draggedEl.parentElement.id === 'fb-bank') {
            const clone = draggedEl.cloneNode(true);
            clone.classList.remove('dragging');
            zone.appendChild(clone);
          } else {
            zone.appendChild(draggedEl);
          }
        } else if (bank) {
          // If dragged from a drop zone back to the bank, delete it (trash can behavior)
          if (draggedEl.parentElement.id !== 'fb-bank') {
            draggedEl.remove();
          }
        }
      });
    }

    function resetFillBlanks() {
      if (currentFillBlanksPayload) renderFillBlanks(currentFillBlanksPayload);
    }

    function closeFillBlanks() {
      document.getElementById('student-page-view').classList.add('hidden');
      document.getElementById('wordPane').classList.remove('hidden');
      currentFillBlanksPayload = null;
    }

    // ====== STATIC PAGE ENGINES (story, sentences, matching) ======
    function closeStaticPage() {
      document.getElementById('student-page-view').classList.add('hidden');
      document.getElementById('wordPane').classList.remove('hidden');
    }

    function launchStory(payload) {
      if (!payload) return;
      document.getElementById('wordPane').classList.add('hidden');
      const pageView = document.getElementById('student-page-view');
      pageView.classList.remove('hidden');
      pageView.innerHTML = `
        <div class="static-board-view">
          <div class="static-board-title">${escHtml(payload.title)}</div>
          <div class="static-board-text">${escHtml(payload.text)}</div>
          <button class="btn danger" onclick="closeStaticPage()">✕ Return to Tile Board</button>
        </div>
      `;
    }

    function launchSentences(payload) {
      if (!Array.isArray(payload) || payload.length === 0) return;
      document.getElementById('wordPane').classList.add('hidden');
      const pageView = document.getElementById('student-page-view');
      pageView.classList.remove('hidden');
      const items = payload.map(s => `<div class="static-board-sentence">${escHtml(s)}</div>`).join('');
      pageView.innerHTML = `
        <div class="static-board-view">
          <div class="static-board-label">✏️ Sentence Marking</div>
          <div class="static-sentence-list">${items}</div>
          <button class="btn danger" onclick="closeStaticPage()">✕ Return to Tile Board</button>
        </div>
      `;
    }

    function launchMatching(payload) {
      if (!payload || !payload.left || !payload.right) return;
      document.getElementById('wordPane').classList.add('hidden');
      const pageView = document.getElementById('student-page-view');
      pageView.classList.remove('hidden');
      const leftCol = payload.left.map(w => `<div class="static-match-item static-match-left">${escHtml(w)}</div>`).join('');
      const rightCol = payload.right.map(w => `<div class="static-match-item static-match-right">${escHtml(w)}</div>`).join('');
      pageView.innerHTML = `
        <div class="static-board-view">
          <div class="static-board-label">🔗 Matching</div>
          <div class="static-matching-cols">
            <div class="static-match-col">${leftCol}</div>
            <div class="static-match-divider"></div>
            <div class="static-match-col">${rightCol}</div>
          </div>
          <button class="btn danger" onclick="closeStaticPage()">✕ Return to Tile Board</button>
        </div>
      `;
    }

    // ====== TILE PHYSICS & SPAWNING ======
    function spawnTiles(letterArray) {
        tiles = []; 
        const wp = document.getElementById('wordPane');
        const startX = (wp.clientWidth / 2) - ((letterArray.length * TILE_SIZE) / 2);
        const startY = (wp.clientHeight / 2) - (TILE_SIZE / 2);

        letterArray.forEach((letter, index) => {
            let color = ['a','e','i','o','u'].includes(letter) ? 'yellow' : 'blue';
            tiles.push({ id: Date.now() + index, text: letter.toUpperCase(), color: color, x: startX + (index * TILE_SIZE), y: startY });
        });
        renderWordPane();
    }

    function renderWordPane(){
      const wp = document.getElementById('wordPane');
      wp.querySelectorAll('.word-pane-tile').forEach(el=>el.remove());
      wp.querySelector('.hint').style.display = tiles.length > 0 ? 'none' : 'block';

      tiles.forEach(tile => {
        const el = document.createElement('div');
        el.className = `tile ${tile.color} word-pane-tile`;
        el.textContent = tile.text;
        if(tile.text.length > 1) el.style.fontSize = '15px';
        el.style.left = tile.x + 'px'; 
        el.style.top = tile.y + 'px';
        wp.appendChild(el);
      });
    }

    function speakText(text) {
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      setTimeout(() => {
        let u = new SpeechSynthesisUtterance(text);
        u.rate = 0.8; 
        window.speechSynthesis.speak(u);
      }, 50);
    }

    document.getElementById('resetButton').addEventListener('click', ()=>{ tiles=[]; renderWordPane(); });
  </script>
</body>
</html>
