<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="1; url=app.html" />
  <title>Barton Command Center</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f6;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #64748b;
      --accent: #2f6bed;
      --accent-dark: #2257cf;
      --line: #dbe3ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      line-height: 1.15;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(47, 107, 237, 0.28);
    }

    a:hover,
    a:focus-visible {
      background: var(--accent-dark);
    }
  </style>
</head>
<body>
  <main>
    <h1>Barton Command Center now runs from app.html.</h1>
    <p>You will be redirected automatically. Use the button below if it does not open.</p>
    <a href="app.html">Open Barton Command Center</a>
  </main>
</body>
</html>
