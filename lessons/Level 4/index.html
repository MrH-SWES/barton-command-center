<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="1; url=../../app.html" />
  <title>Barton Command Center</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef1f6;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: min(480px, 100%);
      background: #ffffff;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 14px 34px rgba(31, 41, 55, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.6rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 22px;
      color: #64748b;
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 10px;
      background: #2f6bed;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Barton Command Center now runs from app.html.</h1>
    <p>This folder page was retired. You will be redirected to the main app.</p>
    <a href="../../app.html">Open Barton Command Center</a>
  </main>
</body>
</html>
